<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>13</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#8b0000;
    font-family:"Courier New",monospace;
    cursor:crosshair;
}

body{
    background:#000;
}

/* =========================================
   ENTER
========================================= */

#enter{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    cursor:pointer;
}

#enterTitle{
    color:#8b0000;
    font-size:14px;
    letter-spacing:10px;
    animation:enterPulse 2s infinite;
}

#enterSmall{
    color:#350000;
    font-size:8px;
    letter-spacing:4px;
    margin-top:18px;
}

@keyframes enterPulse{
    0%,100%{opacity:.2}
    50%{opacity:1}
}

/* =========================================
   MAIN
========================================= */

#screen{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

#image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    filter:
        grayscale(1)
        contrast(2.3)
        brightness(.3);
    transition:opacity .05s;
}

/* =========================================
   RED VIGNETTE
========================================= */

#vignette{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(80,0,0,.15) 55%,
            rgba(120,0,0,.65) 100%
        );
}

/* =========================================
   SCANLINES
========================================= */

#scanlines{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,0,0,.035) 0px,
            rgba(255,0,0,.035) 1px,
            transparent 1px,
            transparent 4px
        );
}

/* =========================================
   CAMERA FEED
========================================= */

#camera{
    position:fixed;
    top:12px;
    left:14px;
    z-index:100;
    color:#4d0000;
    font-size:8px;
    line-height:14px;
    letter-spacing:2px;
    opacity:.7;
    pointer-events:none;
}

#cameraDot{
    display:inline-block;
    width:5px;
    height:5px;
    background:#800000;
    border-radius:50%;
    margin-right:5px;
    animation:blink .8s infinite;
}

@keyframes blink{
    0%,100%{opacity:.2}
    50%{opacity:1}
}

/* =========================================
   FALLING NUMBERS
========================================= */

#numbers{
    position:fixed;
    inset:0;
    z-index:5;
    overflow:hidden;
    pointer-events:none;
}

.number{
    position:absolute;
    top:-40px;
    color:#520000;
    opacity:.65;
    font-size:10px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-60px);
    }
    to{
        transform:translateY(110vh);
    }
}

/* =========================================
   CENTER MESSAGE
========================================= */

#message{
    position:fixed;
    z-index:200;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    color:#b00000;
    font-size:clamp(14px,4vw,30px);
    letter-spacing:8px;
    text-align:center;

    opacity:0;
    pointer-events:none;

    text-shadow:
        0 0 8px #700000,
        0 0 30px #300000;
}

/* =========================================
   BLOOD
========================================= */

#blood{
    position:fixed;
    inset:0;
    z-index:250;
    pointer-events:none;
    overflow:hidden;
}

.drip{
    position:absolute;
    top:-10px;
    width:3px;

    background:
        linear-gradient(
            #a00000,
            #300000
        );

    border-radius:
        0 0 8px 8px;

    box-shadow:
        0 0 7px #400000;

    animation:
        dripDown linear forwards;
}

@keyframes dripDown{
    from{
        top:-15px;
        height:0;
    }
    to{
        top:0;
        height:var(--height);
    }
}

.splatter{
    position:absolute;
    background:#800000;
    border-radius:50%;
    opacity:.8;
    box-shadow:0 0 5px #300000;
}

/* =========================================
   SYMBOL
========================================= */

#symbol{
    position:fixed;
    right:20px;
    top:18px;
    z-index:100;
    color:#500000;
    font-size:22px;
    opacity:.35;
    pointer-events:none;
}

/* =========================================
   GLITCH
========================================= */

.glitch{
    animation:
        glitch .07s steps(2) infinite;
}

@keyframes glitch{

    0%{
        transform:translate(0);
    }

    20%{
        transform:translate(-9px,3px);
        filter:invert(.6);
    }

    40%{
        transform:translate(8px,-4px);
        filter:contrast(4);
    }

    60%{
        transform:translate(-4px,6px);
    }

    80%{
        transform:translate(7px,-2px);
        filter:invert(.3);
    }

    100%{
        transform:translate(0);
    }
}

/* =========================================
   FLASH
========================================= */

#flash{
    position:fixed;
    inset:0;
    z-index:5000;
    background:#fff;
    opacity:0;
    pointer-events:none;
}

/* =========================================
   JUMPSCARE
========================================= */

#jump{
    position:fixed;
    inset:0;
    z-index:4000;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000;
}

#jump img{
    width:100%;
    height:100%;
    object-fit:cover;

    filter:
        grayscale(1)
        contrast(3.5)
        brightness(.6);

    transform:scale(1.5);
}

/* =========================================
   LOCATION
========================================= */

#location{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;

    text-align:center;

    opacity:.75;
}

#find{
    background:#000;
    border:1px solid #450000;
    color:#650000;

    padding:9px 15px;

    font-family:monospace;
    font-size:8px;
    letter-spacing:4px;

    cursor:pointer;
}

#find:hover{
    border-color:#a00000;
    color:#a00000;
}

#coords{
    color:#500000;
    font-size:8px;
    line-height:14px;
    margin-top:7px;
}

/* =========================================
   FINAL
========================================= */

#final{
    position:fixed;
    inset:0;
    z-index:7000;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#000;
}

#finalMain{
    color:#900000;
    font-size:clamp(18px,5vw,42px);
    letter-spacing:9px;
}

#finalSub{
    color:#350000;
    font-size:8px;
    letter-spacing:3px;
    margin-top:20px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    #camera{
        font-size:7px;
    }

    #symbol{
        font-size:18px;
    }

}
</style>
</head>

<body>

<!-- =======================================
     ENTER
======================================= -->

<div id="enter">

    <div id="enterTitle">
        ENTER
    </div>

    <div id="enterSmall">
        SOUND REQUIRED
    </div>

</div>


<!-- =======================================
     MAIN
======================================= -->

<div id="screen">

    <img
        id="image"
        src="cat1.jpeg"
        alt=""
    >

</div>


<!-- =======================================
     CAMERA
======================================= -->

<div id="camera">
    <span id="cameraDot"></span>
    CAM_13<br>
    REC 00:00:00
</div>


<!-- =======================================
     SYMBOL
======================================= -->

<div id="symbol">
    ⛧
</div>


<!-- =======================================
     EFFECTS
======================================= -->

<div id="numbers"></div>

<div id="vignette"></div>

<div id="scanlines"></div>

<div id="message"></div>

<div id="blood"></div>

<div id="flash"></div>


<!-- =======================================
     JUMPSCARE
======================================= -->

<div id="jump">

    <img
        id="jumpImage"
        src="cat2.jpeg"
        alt=""
    >

</div>


<!-- =======================================
     LOCATION
======================================= -->

<div id="location">

    <button id="find">
        FIND ME
    </button>

    <div id="coords"></div>

</div>


<!-- =======================================
     FINAL
======================================= -->

<div id="final">

    <div id="finalMain">
        I SEE YOU
    </div>

    <div id="finalSub">
        CAM_13 // CONNECTION FOUND
    </div>

</div>


<script>

/* =================================================
   VARIABLES
================================================= */

const enter =
    document.getElementById("enter");

const image =
    document.getElementById("image");

const jump =
    document.getElementById("jump");

const jumpImage =
    document.getElementById("jumpImage");

const message =
    document.getElementById("message");

const numbers =
    document.getElementById("numbers");

const bloodContainer =
    document.getElementById("blood");

const flash =
    document.getElementById("flash");

const screen =
    document.getElementById("screen");

let started = false;

let inactivity = 0;

let seconds = 0;

let audioContext;


/* =================================================
   CREEPY AUDIO ENGINE
   This works without YouTube.
================================================= */

function startAudio(){

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const ctx =
        audioContext;


    /* LOW DRONE */

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    oscillator.type =
        "sawtooth";

    oscillator.frequency.value =
        42;

    gain.gain.value =
        0.035;

    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );

    oscillator.start();


    /* second low tone */

    const osc2 =
        ctx.createOscillator();

    const gain2 =
        ctx.createGain();

    osc2.type =
        "sine";

    osc2.frequency.value =
        61;

    gain2.gain.value =
        0.025;

    osc2.connect(gain2);

    gain2.connect(
        ctx.destination
    );

    osc2.start();


    /* slowly change the drone */

    setInterval(
        ()=>{

            if(!audioContext)
                return;

            oscillator.frequency
                .setTargetAtTime(
                    35 + Math.random()*20,
                    ctx.currentTime,
                    2
                );

            osc2.frequency
                .setTargetAtTime(
                    45 + Math.random()*30,
                    ctx.currentTime,
                    2
                );

        },
        5000
    );

}


/* =================================================
   SCREAM / IMPACT SOUND
================================================= */

function scream(){

    if(!audioContext)
        return;

    const ctx =
        audioContext;

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    const distortion =
        ctx.createWaveShaper();


    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        100,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        ctx.currentTime + .12
    );

    osc.frequency.exponentialRampToValueAtTime(
        160,
        ctx.currentTime + .65
    );


    gain.gain.setValueAtTime(
        .001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .35,
        ctx.currentTime + .03
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .7
    );


    const curve =
        new Float32Array(256);

    for(
        let i=0;
        i<256;
        i++
    ){

        const x =
            i / 256 * 2 - 1;

        curve[i] =
            Math.tanh(x * 5);

    }

    distortion.curve =
        curve;


    osc.connect(
        distortion
    );

    distortion.connect(
        gain
    );

    gain.connect(
        ctx.destination
    );

    osc.start();

    osc.stop(
        ctx.currentTime + .75
    );

}


/* =================================================
   SMALL STATIC SOUND
================================================= */

function staticSound(){

    if(!audioContext)
        return;

    const ctx =
        audioContext;

    const buffer =
        ctx.createBuffer(
            1,
            ctx.sampleRate * .12,
            ctx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i] =
            (Math.random()*2-1)
            *
            Math.pow(
                1-i/data.length,
                2
            );

    }

    const source =
        ctx.createBufferSource();

    const gain =
        ctx.createGain();

    source.buffer =
        buffer;

    gain.gain.value =
        .12;

    source.connect(gain);

    gain.connect(
        ctx.destination
    );

    source.start();

}


/* =================================================
   START EXPERIENCE
================================================= */

enter.addEventListener(
    "click",
    ()=>{

        if(started)
            return;

        started = true;

        enter.style.transition =
            "opacity 1s";

        enter.style.opacity =
            "0";

        setTimeout(
            ()=>{
                enter.remove();
            },
            1000
        );


        /* AUDIO */

        startAudio();


        /* TIMER */

        setInterval(
            ()=>{
                seconds++;
                updateCamera();
            },
            1000
        );


        /* HORROR */

        setInterval(
            progress,
            1000
        );

    }
);


/* =================================================
   CAMERA CLOCK
================================================= */

function updateCamera(){

    const h =
        String(
            Math.floor(seconds/3600)
        ).padStart(2,"0");

    const m =
        String(
            Math.floor(
                seconds%3600/60
            )
        ).padStart(2,"0");

    const s =
        String(
            seconds%60
        ).padStart(2,"0");

    document
    .getElementById("camera")
    .innerHTML =
        '<span id="cameraDot"></span>' +
        'CAM_13<br>' +
        'REC ' +
        h+":"+m+":"+s;

}


/* =================================================
   FALLING NUMBERS
================================================= */

function makeNumber(){

    const n =
        document.createElement(
            "div"
        );

    n.className =
        "number";

    let value = "";

    const chars =
        "0135792468";

    const length =
        2 +
        Math.floor(
            Math.random()*9
        );

    for(
        let i=0;
        i<length;
        i++
    ){

        value +=
            chars[
                Math.floor(
                    Math.random()*
                    chars.length
                )
            ];

    }

    n.textContent =
        value;

    n.style.left =
        Math.random()*100+"%";

    n.style.animationDuration =
        3 +
        Math.random()*8 +
        "s";

    n.style.fontSize =
        7 +
        Math.random()*7 +
        "px";

    numbers.appendChild(n);

    setTimeout(
        ()=>{
            n.remove();
        },
        13000
    );

}

setInterval(
    makeNumber,
    110
);


/* =================================================
   MESSAGE
================================================= */

const messages = [

    "13",
    "LOOK",
    "NO",
    "HE KNOWS",
    "STOP",
    "RUN",
    "BEHIND YOU",
    "I SEE YOU",
    "HE'S HERE",
    "DON'T",
    "13",
    "13"

];

function showMessage(
    text
){

    message.textContent =
        text ||
        messages[
            Math.floor(
                Math.random()*
                messages.length
            )
        ];

    message.style.opacity =
        "1";

    setTimeout(
        ()=>{
            message.style.opacity =
                "0";
        },
        250 +
        Math.random()*700
    );

}


/* =================================================
   BLOOD DRIPS
================================================= */

function blood(){

    for(
        let i=0;
        i<15;
        i++
    ){

        const drip =
            document.createElement(
                "div"
            );

        drip.className =
            "drip";

        drip.style.left =
            Math.random()*100+"%";

        drip.style.setProperty(
            "--height",
            30 +
            Math.random()*200 +
            "px"
        );

        drip.style.animationDuration =
            .4 +
            Math.random()*1.5 +
            "s";

        bloodContainer.appendChild(
            drip
        );

        setTimeout(
            ()=>{
                drip.remove();
            },
            3500
        );

    }

}


/* =================================================
   BLOOD SPLATTER
================================================= */

function splatter(){

    for(
        let i=0;
        i<40;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );

        dot.className =
            "splatter";

        const size =
            1 +
            Math.random()*8;

        dot.style.width =
            size+"px";

        dot.style.height =
            size+"px";

        dot.style.left =
            Math.random()*100+"%";

        dot.style.top =
            Math.random()*100+"%";

        bloodContainer.appendChild(
            dot
        );

        setTimeout(
            ()=>{
                dot.remove();
            },
            2500
        );

    }

}


/* =================================================
   WHITE FLASH
================================================= */

function whiteFlash(){

    flash.style.opacity =
        ".9";

    setTimeout(
        ()=>{
            flash.style.opacity =
                "0";
        },
        30
    );

}


/* =================================================
   RED FLASH
================================================= */

function redFlash(){

    flash.style.background =
        "#8b0000";

    flash.style.opacity =
        ".7";

    setTimeout(
        ()=>{
            flash.style.opacity =
                "0";

            flash.style.background =
                "#fff";
        },
        45
    );

}


/* =================================================
   GLITCH
================================================= */

function glitch(
    duration=400
){

    screen.classList.add(
        "glitch"
    );

    setTimeout(
        ()=>{
            screen.classList.remove(
                "glitch"
            );
        },
        duration
    );

}


/* =================================================
   IMAGE FLASH
================================================= */

function imageFlash(
    src,
    duration=150,
    zoom=1.3
){

    image.src =
        src;

    image.style.transform =
        scale(${zoom});

    image.style.opacity =
        "1";

    setTimeout(
        ()=>{
            image.style.opacity =
                "0";
        },
        duration
    );

}


/* =================================================
   JUMPSCARE
================================================= */

function jumpscare(){

    jump.style.display =
        "flex";

    jumpImage.style.transform =
        "scale(1.55)";

    scream();

    whiteFlash();

    setTimeout(
        ()=>{
            jump.style.display =
                "none";
        },
        180 +
        Math.random()*180
    );

}


/* =================================================
   HORROR PROGRESSION
================================================= */

function progress(){

    inactivity++;


    /* -------------------------------
       5 SECONDS
    ------------------------------- */

    if(
        inactivity === 5
    ){

        showMessage("13");

    }


    /* -------------------------------
       9
    ------------------------------- */

    if(
        inactivity === 9
    ){

        staticSound();

        imageFlash(
            "cat1.jpeg",
            250,
            1.05
        );

    }


    /* -------------------------------
       14
    ------------------------------- */

    if(
        inactivity === 14
    ){

        showMessage("LOOK");

        blood();

    }


    /* -------------------------------
       19
    ------------------------------- */

    if(
        inactivity === 19
    ){

        imageFlash(
            "cat2.jpeg",
            110,
            1.35
        );

        glitch(500);

        staticSound();

    }


    /* -------------------------------
       25
    ------------------------------- */

    if(
        inactivity === 25
    ){

        jumpscare();

        splatter();

    }


    /* -------------------------------
       32
    ------------------------------- */

    if(
        inactivity === 32
    ){

        showMessage(
            "HE KNOWS"
        );

        blood();

        redFlash();

    }


    /* -------------------------------
       40
    ------------------------------- */

    if(
        inactivity === 40
    ){

        imageFlash(
            "cat2.jpeg",
            80,
            1.7
        );

        glitch(900);

        scream();

    }


    /* -------------------------------
       50
    ------------------------------- */

    if(
        inactivity === 50
    ){

        showMessage(
            "I SEE YOU"
        );

        blood();

        splatter();

    }


    /* -------------------------------
       60
    ------------------------------- */

    if(
        inactivity === 60
    ){

        jumpscare();

        setTimeout(
            ()=>{
                jumpscare();
            },
            500
        );

    }


    /* -------------------------------
       75
    ------------------------------- */

    if(
        inactivity === 75
    ){

        finalAttack();

    }

}


/* =================================================
   USER MOVEMENT
================================================= */

document.addEventListener(
    "mousemove",
    ()=>{

        inactivity = 0;

        /*
           Sometimes the site reacts
           immediately to movement.
        */

        if(
            started &&
            Math.random()<.018
        ){

            showMessage();

        }

    }
);


document.addEventListener(
    "touchstart",
    ()=>{

        inactivity = 0;

    }
);


/* =================================================
   RANDOM IMAGE ATTACKS
================================================= */

setInterval(
    ()=>{

        if(
            !started
        )
            return;

        if(
            Math.random()<.14
        ){

            imageFlash(
                Math.random()<.5
                    ?"cat1.jpeg"
                    :"cat2.jpeg",

                70 +
                Math.random()*170,

                1 +
                Math.random()*.8
            );

            staticSound();

        }

    },
    3500
);


/* =================================================
   RANDOM GLITCHES
================================================= */

setInterval(
    ()=>{

        if(
            started &&
            Math.random()<.25
        ){

            glitch(
                80 +
                Math.random()*500
            );

        }

    },
    2800
);


/* =================================================
   RANDOM BLOOD
================================================= */

setInterval(
    ()=>{

        if(
            started &&
            Math.random()<.22
        ){

            blood();

        }

    },
    7000
);


/* =================================================
   RANDOM MESSAGES
================================================= */

setInterval(
    ()=>{

        if(
            started &&
            Math.random()<.15
        ){

            showMessage();

        }

    },
    6000
);


/* =================================================
   LOCATION
================================================= */

document
.getElementById("find")
.addEventListener(
    "click",
    ()=>{

        const output =
            document.getElementById(
                "coords"
            );

        output.textContent =
            "SEARCHING...";


        if(
            !navigator.geolocation
        ){

            output.textContent =
                "UNAVAILABLE";

            return;

        }


        navigator.geolocation
        .getCurrentPosition(

            position=>{

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                output.innerHTML =
                    "LAT " +
                    lat.toFixed(5) +
                    "<br>" +
                    "LON " +
                    lon.toFixed(5);


                setTimeout(
                    ()=>{
                        showMessage(
                            "I FOUND YOU"
                        );

                        redFlash();

                        glitch(1000);

                        blood();

                    },
                    600
                );

            },

            ()=>{

                output.textContent =
                    "DENIED";

                showMessage(
                    "I KNOW"
                );

            },
