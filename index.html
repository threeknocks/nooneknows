<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>13</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#8b0000;
    font-family:monospace;
    cursor:crosshair;
}

/* ENTER SCREEN */

#enter{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    cursor:pointer;
}

#enterText{
    color:#650000;
    font-size:12px;
    letter-spacing:8px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{opacity:.25}
    50%{opacity:1}
}

#enterSub{
    margin-top:18px;
    color:#260000;
    font-size:8px;
    letter-spacing:3px;
}

/* FALLING NUMBERS */

#numbers{
    position:fixed;
    inset:0;
    z-index:2;
    overflow:hidden;
    pointer-events:none;
}

.number{
    position:absolute;
    top:-40px;
    color:#470000;
    opacity:.65;
    font-size:11px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{transform:translateY(-50px)}
    to{transform:translateY(110vh)}
}

/* MAIN */

#main{
    position:fixed;
    inset:0;
    z-index:10;
    background:#000;
    overflow:hidden;
}

#monster{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    filter:
        grayscale(1)
        contrast(2)
        brightness(.25);
    transition:opacity .08s;
}

/* RED VIGNETTE */

#red{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            transparent 25%,
            rgba(80,0,0,.12) 60%,
            rgba(120,0,0,.5) 100%
        );
}

/* SCANLINES */

#scanlines{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,0,0,.025) 0px,
            rgba(255,0,0,.025) 1px,
            transparent 1px,
            transparent 5px
        );
}

/* NOISE */

#noise{
    position:fixed;
    inset:-50%;
    z-index:31;
    pointer-events:none;
    opacity:.06;
    background-image:
        repeating-radial-gradient(
            circle,
            white 0,
            white 1px,
            transparent 1px,
            transparent 4px
        );
    animation:noise .08s steps(2) infinite;
}

@keyframes noise{
    0%{transform:translate(0,0)}
    25%{transform:translate(4px,-3px)}
    50%{transform:translate(-4px,3px)}
    75%{transform:translate(2px,4px)}
    100%{transform:translate(0,0)}
}

/* TEXT */

#message{
    position:fixed;
    z-index:100;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:#b00000;
    font-size:clamp(14px,4vw,32px);
    letter-spacing:7px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    text-shadow:
        0 0 10px #700000,
        0 0 25px #300000;
}

/* BLOOD */

#blood{
    position:fixed;
    inset:0;
    z-index:200;
    pointer-events:none;
}

.drip{
    position:absolute;
    top:-10px;
    width:3px;
    background:linear-gradient(#8d0000,#260000);
    border-radius:0 0 8px 8px;
    box-shadow:0 0 8px #350000;
    animation:drip linear forwards;
}

@keyframes drip{
    from{
        height:0;
        top:-10px;
    }
    to{
        top:0;
        height:var(--height);
    }
}

/* LOCATION */

#locationBox{
    position:fixed;
    z-index:500;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    transition:opacity 1s;
}

#locationButton{
    background:#000;
    border:1px solid #420000;
    color:#650000;
    padding:9px 15px;
    font-family:monospace;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
}

#locationButton:hover{
    border-color:#b00000;
    color:#b00000;
}

#coordinates{
    margin-top:8px;
    color:#4d0000;
    font-size:8px;
    line-height:16px;
}

/* FLASH */

#flash{
    position:fixed;
    inset:0;
    z-index:2000;
    background:#fff;
    opacity:0;
    pointer-events:none;
}

/* JUMPSCARE */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
}

#jumpImage{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:
        grayscale(1)
        contrast(3)
        brightness(.6);
}

/* GLITCH */

.glitch{
    animation:glitch .07s steps(2) infinite;
}

@keyframes glitch{
    0%{
        transform:translate(0);
        filter:none;
    }
    20%{
        transform:translate(-10px,3px);
        filter:invert(.6);
    }
    40%{
        transform:translate(8px,-4px);
        filter:contrast(4);
    }
    60%{
        transform:translate(-4px,5px);
    }
    80%{
        transform:translate(6px,-2px);
        filter:invert(.4);
    }
    100%{
        transform:translate(0);
    }
}

/* FINAL */

#final{
    position:fixed;
    inset:0;
    z-index:3000;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#finalText{
    color:#900000;
    font-size:clamp(18px,5vw,42px);
    letter-spacing:8px;
}

#finalCoordinates{
    margin-top:20px;
    color:#380000;
    font-size:8px;
}

/* YOUTUBE PLAYER */

#player{
    position:fixed;
    width:1px;
    height:1px;
    left:-100px;
    top:-100px;
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<!-- ENTER -->

<div id="enter">
    <div id="enterText">ENTER</div>
    <div id="enterSub">TURN YOUR SOUND ON</div>
</div>

<!-- HIDDEN YOUTUBE PLAYER -->

<div id="player"></div>

<!-- FALLING NUMBERS -->

<div id="numbers"></div>

<!-- MAIN -->

<div id="main">
    <img id="monster" src="cat1.jpeg" alt="">
</div>

<div id="red"></div>
<div id="scanlines"></div>
<div id="noise"></div>

<div id="message"></div>

<div id="blood"></div>

<!-- LOCATION -->

<div id="locationBox">

    <button id="locationButton">
        FIND ME
    </button>

    <div id="coordinates"></div>

</div>

<!-- FLASH -->

<div id="flash"></div>

<!-- JUMPSCARE -->

<div id="jumpscare">

    <img
        id="jumpImage"
        src="cat2.jpeg"
        alt=""
    >

</div>

<!-- FINAL -->

<div id="final">

    <div id="finalText">
        I SEE YOU
    </div>

    <div id="finalCoordinates"></div>

</div>


<script>

/* ==============================================
   YOUTUBE MUSIC
============================================== */

let player;

function onYouTubeIframeAPIReady(){

    player = new YT.Player(
        "player",
        {
            height:"1",
            width:"1",

            videoId:"II5I4HItgzg",

            playerVars:{
                autoplay:0,
                controls:0,
                loop:1,
                playlist:"II5I4HItgzg",
                playsinline:1,
                rel:0
            },

            events:{
                onReady:function(){}
            }
        }
    );
}


/* Load YouTube API */

const yt =
    document.createElement("script");

yt.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(yt);


/* ==============================================
   START
============================================== */

let started = false;

document
.getElementById("enter")
.addEventListener(
    "click",
    startExperience
);

function startExperience(){

    if(started) return;

    started = true;

    const enter =
        document.getElementById("enter");

    enter.style.transition =
        "opacity .8s";

    enter.style.opacity =
        "0";

    setTimeout(
        () => {
            enter.remove();
        },
        900
    );


    /* music */

    setTimeout(
        () => {

            if(player){
                player.playVideo();
            }

        },
        500
    );


    /* begin horror */

    setInterval(
        progress,
        1000
    );


    /* show location later */

    setTimeout(
        () => {

            document
            .getElementById("locationBox")
            .style.opacity = "1";

        },
        18000
    );

}


/* ==============================================
   NUMBERS
============================================== */

const numbers =
    document.getElementById("numbers");

function createNumber(){

    const n =
        document.createElement("div");

    n.className =
        "number";

    const chars =
        "0135792468";

    let text = "";

    for(
        let i=0;
        i<Math.floor(
            Math.random()*8
        )+3;
        i++
    ){

        text +=
            chars[
                Math.floor(
                    Math.random()*
                    chars.length
                )
            ];

    }

    n.textContent =
        text;

    n.style.left =
        Math.random()*100+"%";

    n.style.animationDuration =
        Math.random()*7+4+"s";

    numbers.appendChild(n);

    setTimeout(
        ()=>n.remove(),
        13000
    );

}

setInterval(
    createNumber,
    140
);


/* ==============================================
   TEXT
============================================== */

const message =
    document.getElementById("message");

const messages = [

    "13",
    "LOOK",
    "NO",
    "HE KNOWS",
    "STOP",
    "RUN",
    "BEHIND YOU",
    "I SEE YOU",
    "13",
    "13",
    "DON'T LOOK"

];

function showMessage(text){

    message.textContent =
        text ||
        messages[
            Math.floor(
                Math.random()*
                messages.length
            )
        ];

    message.style.opacity =
        "1";

    setTimeout(
        ()=>{
            message.style.opacity="0";
        },
        250+Math.random()*600
    );

}


/* ==============================================
   BLOOD
============================================== */

function blood(){

    const container =
        document.getElementById("blood");

    for(
        let i=0;
        i<Math.floor(Math.random()*12)+8;
        i++
    ){

        const d =
            document.createElement("div");

        d.className =
            "drip";

        d.style.left =
            Math.random()*100+"%";

        d.style.setProperty(
            "--height",
            Math.random()*180+30+"px"
        );

        d.style.animationDuration =
            Math.random()*1.5+.5+"s";

        container.appendChild(d);

        setTimeout(
            ()=>d.remove(),
            3500
        );

    }

}


/* ==============================================
   FLASH
============================================== */

function flashScreen(){

    const flash =
        document.getElementById("flash");

    flash.style.opacity=".9";

    setTimeout(
        ()=>{
            flash.style.opacity="0";
        },
        35
    );

}


/* ==============================================
   GLITCH
============================================== */

function glitch(duration=400){

    const main =
        document.getElementById("main");

    main.classList.add("glitch");

    setTimeout(
        ()=>{
            main.classList.remove("glitch");
        },
        duration
    );

}


/* ==============================================
   IMAGE FLASH
============================================== */

const monster =
    document.getElementById("monster");

function imageFlash(
    image,
    time=180,
    zoom=1.2
){

    monster.src =
        image;

    monster.style.transform =
        scale(${zoom});

    monster.style.opacity =
        "1";

    setTimeout(
        ()=>{
            monster.style.opacity="0";
        },
        time
    );

}


/* ==============================================
   REAL JUMPSCARE
============================================== */

function jumpscare(){

    const box =
        document.getElementById(
            "jumpscare"
        );

    const img =
        document.getElementById(
            "jumpImage"
        );

    img.style.transform =
        "scale(1.45)";

    box.style.display =
        "flex";

    flashScreen();

    setTimeout(
        ()=>{
            box.style.display="none";
        },
        220
    );

}


/* ==============================================
   HORROR PROGRESSION
============================================== */

let inactivity = 0;

function progress(){

    inactivity++;


    /* 5 seconds */

    if(inactivity===5){

        showMessage("13");

    }


    /* 9 */

    if(inactivity===9){

        imageFlash(
            "cat1.jpeg",
            250,
            1.05
        );

    }


    /* 14 */

    if(inactivity===14){

        showMessage("LOOK");

        blood();

    }


    /* 20 */

    if(inactivity===20){

        imageFlash(
            "cat2.jpeg",
            130,
            1.3
        );

        glitch(500);

    }


    /* 27 */

    if(inactivity===27){

        jumpscare();

    }


    /* 34 */

    if(inactivity===34){

        showMessage(
            "HE KNOWS"
        );

        blood();

    }


    /* 42 */

    if(inactivity===42){

        imageFlash(
            "cat2.jpeg",
            90,
            1.6
        );

        flashScreen();

        glitch(900);

    }


    /* 55 */

    if(inactivity===55){

        showMessage(
            "I SEE YOU"
        );

        blood();

        imageFlash(
            "cat1.jpeg",
            500,
            1.4
        );

    }


    /* 70 */

    if(inactivity===70){

        finalAttack();

    }

}


/* ==============================================
   MOUSE ACTIVITY
============================================== */

document.addEventListener(
    "mousemove",
    ()=>{

        inactivity=0;

        if(
            Math.random()<.025
        ){

            showMessage();

        }

    }
);


document.addEventListener(
    "touchstart",
    ()=>{

        inactivity=0;

    }
);


/* ==============================================
   RANDOM EVENTS
============================================== */

setInterval(
    ()=>{

        if(
            !started
        ) return;

        if(
            Math.random()<.13
        ){

            imageFlash(
                Math.random()<.5
                    ?"cat1.jpeg"
                    :"cat2.jpeg",
                100+Math.random()*180,
                1+Math.random()*.7
            );

        }

    },
    4300
);


setInterval(
    ()=>{

        if(
            started &&
            Math.random()<.18
        ){

            glitch(
                100+Math.random()*500
            );

        }

    },
    3600
);


/* ==============================================
   LOCATION
============================================== */

document
.getElementById("locationButton")
.addEventListener(
    "click",
    ()=>{

        const output =
            document.getElementById(
                "coordinates"
            );

        output.textContent =
            "SEARCHING...";


        if(
            !navigator.geolocation
        ){

            output.textContent =
                "UNAVAILABLE";

            return;

        }


        navigator.geolocation
        .getCurrentPosition(

            position=>{

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                output.innerHTML =
                    `LAT ${lat.toFixed(5)}<br>`+
                    LON ${lon.toFixed(5)};


                document
                .getElementById(
                    "finalCoordinates"
                )
                .textContent =
                    ${lat.toFixed(5)} / ${lon.toFixed(5)};


                setTimeout(
                    ()=>{
                        showMessage(
                            "I SEE YOU"
                        );
                    },
                    600
                );


                setTimeout(
                    ()=>{
                        blood();
                        glitch(1000);
                    },
                    1200
                );

            },

            ()=>{
                output.textContent =
                    "DENIED";

                showMessage(
                    "I KNOW"
                );

            },

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }

        );

    }
);


/* ==============================================
   FINAL
============================================== */

function finalAttack(){

    flashScreen();

    setTimeout(
        ()=>{

            const box =
                document.getElementById(
                    "jumpscare"
                );

            const img =
                document.getElementById(
                    "jumpImage"
                );

            img.style.transform =
                "scale(1.😎";

            box.style.display =
                "flex";

            blood();

            glitch(1800);

        },
        100
    );


    setTimeout(
        ()=>{

            document
            .getElementById(
                "jumpscare"
            )
            .style.display =
                "none";

            document
            .getElementById(
                "final"
            )
            .style.display =
                "flex";

        },
        1800
    );

}


/* ==============================================
   INITIAL NUMBERS
============================================== */

for(
    let i=0;
    i<50;
    i++
){

    setTimeout(
        createNumber,
        i*70
    );

}

</script>

</body>
</html>
