<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CAT IS BACK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #ddd;
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: min(900px, 92vw);
      min-height: 80vh;
      padding: 35px;
      border: 1px solid #222;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.015) 0px,
          rgba(255,255,255,.015) 1px,
          transparent 1px,
          transparent 4px
        ),
        #080808;
      box-shadow: 0 0 50px rgba(0,0,0,.9);
      position: relative;
    }

    .header {
      color: #777;
      font-size: 12px;
      margin-bottom: 35px;
    }

    .terminal {
      line-height: 1.8;
      font-size: clamp(14px, 2vw, 18px);
    }

    .red {
      color: #b00000;
    }

    .big {
      font-size: clamp(30px, 8vw, 75px);
      letter-spacing: 8px;
      margin: 40px 0;
      color: #eee;
      text-align: center;
      animation: flicker 4s infinite;
    }

    .message {
      margin: 30px 0;
      min-height: 100px;
    }

    button {
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      padding: 12px 18px;
      font-family: inherit;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #151515;
      color: white;
      border-color: #888;
    }

    #locationResult {
      margin-top: 25px;
      color: #777;
      min-height: 60px;
    }

    .warning {
      color: #7d0000;
      margin-top: 40px;
      font-size: 12px;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #aaa;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    .glitch {
      animation: glitch .15s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes flicker {
      0%, 18%, 20%, 22%, 65%, 100% { opacity: 1; }
      19%, 21%, 64% { opacity: .25; }
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      25% { transform: translate(2px, -1px); }
      50% { transform: translate(-2px, 1px); }
      75% { transform: translate(1px, 2px); }
      100% { transform: translate(0); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="screen">

    <div class="header">
      CONNECTION ESTABLISHED<br>
      UNKNOWN TERMINAL // 03:17:44
    </div>

    <div class="terminal">

      <div>
        > searching...
      </div>

      <div>
        > searching for CAT...
      </div>

      <div class="red">
        > RESULT FOUND
      </div>

      <div class="big" id="title">
        THE CAT IS BACK
      </div>

      <div class="message" id="message"></div>

      <span class="cursor"></span>

      <br><br>

      <button id="locationButton">
        I WANT TO KNOW WHERE I AM
      </button>

      <div id="locationResult"></div>

      <div class="warning">
        WARNING: SOME THINGS ARE BETTER LEFT UNFOUND.
      </div>

    </div>
  </main>

  <script>

    const messages = [
      "you weren't supposed to find this.",
      "he remembers the last time.",
      "the hat is still here.",
      "don't look behind you.",
      "you noticed too late.",
      "he knows the rhyme.",
      "there should only be one.",
      "the cat is watching.",
      "you already opened the door."
    ];

    const messageBox = document.getElementById("message");
    const title = document.getElementById("title");
    const button = document.getElementById("locationButton");
    const result = document.getElementById("locationResult");

    function typeText(text, speed = 55) {

      messageBox.textContent = "";

      let i = 0;

      const interval = setInterval(() => {

        messageBox.textContent += text[i];

        i++;

        if (i >= text.length) {
          clearInterval(interval);
        }

      }, speed);
    }

    // Random creepy message
    const randomMessage =
      messages[Math.floor(Math.random() * messages.length)];

    setTimeout(() => {
      typeText(randomMessage);
    }, 1200);


    // Random glitch effect
    setInterval(() => {

      if (Math.random() < 0.15) {

        title.classList.add("glitch");

        setTimeout(() => {
          title.classList.remove("glitch");
        }, 180);

      }

    }, 1500);


    // Optional location permission
    button.addEventListener("click", () => {

      if (!navigator.geolocation) {

        result.textContent =
          "LOCATION ACCESS IS NOT AVAILABLE.";

        return;
      }

      result.textContent =
        "REQUESTING LOCATION...";

      navigator.geolocation.getCurrentPosition(

        (position) => {

          const lat =
            position.coords.latitude.toFixed(5);

          const lon =
            position.coords.longitude.toFixed(5);

          result.innerHTML =
            "LOCATION FOUND.<br><br>" +
            "LAT: " + lat +
            "<br>" +
            "LON: " + lon +
            "<br><br>" +
            "<span class='red'>THE CAT KNOWS WHERE YOU ARE.</span>";

        },

        () => {

          result.innerHTML =
            "<span class='red'>" +
            "YOU REFUSED.<br>" +
            "GOOD." +
            "</span>";

        }

      );

    });

  </script>

</body>
</html>
