<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAM_13</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:"Courier New",monospace;
}

body{
    cursor:none;
}


/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#000;

    cursor:pointer;
}

#introTitle{
    font-size:13px;
    letter-spacing:6px;
    color:#fff;
}

#introSub{
    margin-top:25px;
    font-size:9px;
    letter-spacing:3px;
    color:#555;
}

#introWarning{
    position:absolute;
    bottom:25px;
    font-size:8px;
    color:#222;
}


/* =========================
   CAMERA
========================= */

#screen{
    position:fixed;
    inset:0;
    background:#050505;
    overflow:hidden;
}

#hallway{

    position:absolute;
    inset:0;

    background:

        linear-gradient(
            90deg,
            #000 0%,
            #080808 20%,
            #111 48%,
            #080808 76%,
            #000 100%
        );

    filter:contrast(1.25);
}


/* distant light */

#light{

    position:absolute;

    left:50%;
    top:0;

    width:16%;
    height:100%;

    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.035),
            transparent
        );

}


/* hallway lines */

#line1,
#line2,
#line3{

    position:absolute;

    height:1px;

    background:#222;

    left:15%;
    right:15%;

}

#line1{
    top:22%;
}

#line2{
    top:51%;
}

#line3{
    top:78%;
}


/* =========================
   CRT
========================= */

#scanlines{

    position:absolute;
    inset:0;

    z-index:50;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.035) 1px,
            transparent 1px,
            transparent 4px
        );

}

#noise{

    position:absolute;
    inset:-20%;

    z-index:51;

    pointer-events:none;

    opacity:.08;

    background-image:
        repeating-radial-gradient(
            circle,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 5px
        );

    animation:noise .08s steps(2) infinite;

}

@keyframes noise{

    0%{
        transform:translate(0);
    }

    25%{
        transform:translate(-5px,3px);
    }

    50%{
        transform:translate(4px,-4px);
    }

    75%{
        transform:translate(-2px,-2px);
    }

    100%{
        transform:translate(0);
    }

}


/* vignette */

#vignette{

    position:absolute;
    inset:0;

    z-index:52;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse,
            transparent 35%,
            rgba(0,0,0,.65) 75%,
            #000 100%
        );

}


/* =========================
   HUD
========================= */

#hud{

    position:absolute;
    inset:0;

    z-index:100;

    pointer-events:none;

    font-size:9px;

    letter-spacing:1px;

    color:#aaa;

}

#cameraNumber{

    position:absolute;

    top:18px;
    left:18px;

    color:#fff;

}

#recording{

    position:absolute;

    top:18px;
    right:18px;

}

#recordingDot{

    display:inline-block;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

    margin-right:6px;

    animation:rec .8s infinite;

}

@keyframes rec{

    50%{
        opacity:0;
    }

}

#timestamp{

    position:absolute;

    bottom:18px;
    left:18px;

    color:#777;

}

#status{

    position:absolute;

    bottom:18px;
    right:18px;

    color:#555;

}


/* =========================
   MINIMAL TEXT
========================= */

#message{

    position:absolute;

    z-index:200;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    white-space:nowrap;

    font-size:
        clamp(
            14px,
            3vw,
            27px
        );

    letter-spacing:7px;

    color:#fff;

    opacity:0;

    text-shadow:
        0 0 12px #fff;

}

.messageShow{

    animation:
        messageFade 3.5s forwards;

}

@keyframes messageFade{

    0%{
        opacity:0;
        filter:blur(10px);
    }

    15%{
        opacity:1;
        filter:none;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================
   CAT
========================= */

#cat{

    position:absolute;

    z-index:40;

    left:50%;
    top:50%;

    width:220px;
    height:420px;

    transform:
        translate(-50%,-50%)
        scale(.18);

    opacity:0;

    transition:
        opacity .08s,
        transform .8s;

    filter:
        grayscale(1)
        contrast(2)
        drop-shadow(
            0 0 18px #fff
        );

}


/* hat */

#hat{

    position:absolute;

    z-index:3;

    left:50%;

    top:0;

    width:120px;
    height:220px;

    transform:
        translateX(-50%)
        rotate(-5deg);

    background:

        repeating-linear-gradient(
            0deg,
            #fff 0px,
            #fff 32px,
            #000 32px,
            #000 64px
        );

    clip-path:
        polygon(
            17% 100%,
            50% 0,
            83% 100%
        );

}


/* head */

#catHead{

    position:absolute;

    left:50%;
    top:150px;

    width:170px;
    height:155px;

    transform:translateX(-50%);

    border-radius:50%;

    background:#000;

    border:
        2px solid #fff;

}


/* ears */

.ear{

    position:absolute;

    top:-65px;

    width:70px;
    height:90px;

    background:#000;

    border:
        2px solid #fff;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );

}

#earLeft{
    left:5px;
    transform:rotate(-15deg);
}

#earRight{
    right:5px;
    transform:rotate(15deg);
}


/* eyes */

.eye{

    position:absolute;

    top:58px;

    width:16px;
    height:32px;

    background:#fff;

    border-radius:50%;

}

.eye:after{

    content:"";

    position:absolute;

    left:6px;
    top:0;

    width:4px;
    height:100%;

    background:#000;

}

#eyeLeft{
    left:43px;
}

#eyeRight{
    right:43px;
}


/* smile */

#smile{

    position:absolute;

    left:35px;
    bottom:30px;

    width:100px;
    height:40px;

    border-bottom:
        3px solid #fff;

    border-radius:
        0 0 50% 50%;

}

#teeth{

    position:absolute;

    left:20px;
    bottom:-2px;

    width:60px;
    height:12px;

    background:#fff;

}


/* body */

#catBody{

    position:absolute;

    left:50%;
    top:290px;

    width:125px;
    height:150px;

    transform:translateX(-50%);

    background:#000;

    border:
        2px solid #fff;

    border-radius:
        60px 60px 0 0;

}


/* =========================
   BLOOD
========================= */

#blood{

    position:absolute;

    inset:0;

    z-index:80;

    pointer-events:none;

}

.bloodDrop{

    position:absolute;

    background:#111;

    border-radius:50%;

    box-shadow:
        0 0 4px #fff;

    opacity:.9;

    animation:
        bloodAppear .15s forwards;

}

@keyframes bloodAppear{

    from{
        opacity:0;
        transform:scale(.1);
    }

    to{
        opacity:.9;
        transform:scale(1);
    }

}


/* =========================
   SYMBOL
========================= */

#symbol{

    position:absolute;

    z-index:150;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    font-size:
        clamp(
            100px,
            25vw,
            250px
        );

    color:#fff;

    text-shadow:
        0 0 20px #fff;

}

.symbolShow{

    animation:
        symbolFlash .8s forwards;

}

@keyframes symbolFlash{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.1)
            rotate(-30deg);
    }

    15%{
        opacity:1;
    }

    65%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.5)
            rotate(30deg);
    }

}


/* =========================
   CAMERA WARNING
========================= */

#cameraWarning{

    position:absolute;

    z-index:300;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:#000;

    text-align:center;

}

#cameraWarning strong{

    font-size:
        clamp(
            18px,
            5vw,
            45px
        );

    letter-spacing:5px;

}

#cameraWarning span{

    margin-top:15px;

    color:#555;

    font-size:9px;

    letter-spacing:3px;

}


/* =========================
   FINAL
========================= */

#final{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:#000;

    text-align:center;

}

#finalTitle{

    font-size:
        clamp(
            20px,
            7vw,
            65px
        );

    letter-spacing:
        clamp(
            3px,
            1vw,
            10px
        );

}

#finalSub{

    margin-top:20px;

    color:#555;

    font-size:9px;

    letter-spacing:4px;

}


/* =========================
   GLITCH
========================= */

.glitch{

    animation:
        glitch .1s steps(2) infinite;

}

@keyframes glitch{

    0%{
        transform:translate(0);
        filter:none;
    }

    20%{
        transform:translate(-10px,2px);
        filter:invert(1);
    }

    40%{
        transform:translate(8px,-3px);
        filter:none;
    }

    60%{
        transform:translate(-4px,4px);
        filter:contrast(3);
    }

    80%{
        transform:translate(5px,-2px);
        filter:invert(.8);
    }

    100%{
        transform:translate(0);
        filter:none;
    }

}


/* =========================
   FLASH
========================= */

#flash{

    position:fixed;

    inset:0;

    z-index:900;

    pointer-events:none;

    background:#fff;

    opacity:0;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #cameraNumber,
    #recording,
    #timestamp,
    #status{

        font-size:7px;

    }

    #cat{

        transform:
            translate(-50%,-50%)
            scale(.15);

    }

}

</style>
</head>


<body>


<!-- =========================
     INTRO
========================= -->

<div id="intro">

    <div id="introTitle">
        CAM_13
    </div>

    <div id="introSub">
        CLICK
    </div>

    <div id="introWarning">
        HEADPHONES NOT ADVISED
    </div>

</div>


<!-- =========================
     SCREEN
========================= -->

<div id="screen">

    <div id="hallway"></div>

    <div id="light"></div>

    <div id="line1"></div>
    <div id="line2"></div>
    <div id="line3"></div>


    <!-- CAT -->

    <div id="cat">

        <div id="hat"></div>

        <div id="catHead">

            <div
                class="ear"
                id="earLeft">
            </div>

            <div
                class="ear"
                id="earRight">
            </div>

            <div
                class="eye"
                id="eyeLeft">
            </div>

            <div
                class="eye"
                id="eyeRight">
            </div>

            <div id="smile">

                <div id="teeth"></div>

            </div>

        </div>

        <div id="catBody"></div>

    </div>


    <!-- SYMBOL -->

    <div id="symbol">
        ⛧
    </div>


    <!-- BLOOD -->

    <div id="blood"></div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- HUD -->

    <div id="hud">

        <div id="cameraNumber">
            CAM_13
        </div>

        <div id="recording">

            <span id="recordingDot"></span>

            REC

        </div>

        <div id="timestamp">
            03:17:25
        </div>

        <div id="status">
            SIGNAL: 100%
        </div>

    </div>


    <!-- EFFECTS -->

    <div id="scanlines"></div>

    <div id="noise"></div>

    <div id="vignette"></div>

</div>


<!-- FLASH -->

<div id="flash"></div>


<!-- CAMERA ACCESS -->

<div id="cameraWarning">

    <strong>
        CAMERA ACCESS
    </strong>

    <span>
        UNKNOWN DEVICE
    </span>

</div>


<!-- FINAL -->

<div id="final">

    <div id="finalTitle">
        HE SAW YOU
    </div>

    <div id="finalSub">
        CAM_13 // OFFLINE
    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let audio = null;

let started = false;

let idle = 0;

let stage = 1;

let catDistance = .18;


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audio.state === "suspended"
    ){

        audio.resume();

    }

}


/* LOW DRONE */

function drone(){

    initAudio();

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type =
        "sine";

    osc.frequency.value =
        42;

    gain.gain.setValueAtTime(
        .0001,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .05,
        audio.currentTime+.5
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+2
    );

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime+2
    );

}


/* STATIC */

function staticNoise(){

    initAudio();

    const buffer =
        audio.createBuffer(
            1,
            audio.sampleRate*.35,
            audio.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }

    const source =
        audio.createBufferSource();

    const gain =
        audio.createGain();

    source.buffer =
        buffer;

    gain.gain.value =
        .035;

    source.connect(gain);

    gain.connect(
        audio.destination
    );

    source.start();

}


/* SCREAM */

function scream(){

    initAudio();

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        100,
        audio.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1800,
        audio.currentTime+.55
    );

    gain.gain.setValueAtTime(
        .0001,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .1,
        audio.currentTime+.04
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+.9
    );

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime+.9
    );

}


/* WHISPER-LIKE TONE */

function whisper(){

    initAudio();

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type =
        "triangle";

    osc.frequency.value =
        75;

    gain.gain.value =
        .015;

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime+.65
    );

}


/* =========================================================
   VISUAL EFFECTS
========================================================= */

function flash(
    duration=70
){

    const f =
        document.getElementById(
            "flash"
        );

    f.style.opacity =
        ".9";

    setTimeout(
        ()=>{
            f.style.opacity="0";
        },
        duration
    );

}


/* GLITCH */

function glitch(
    duration=500
){

    const screen =
        document.getElementById(
            "screen"
        );

    screen.classList.add(
        "glitch"
    );

    setTimeout(
        ()=>{
            screen.classList.remove(
                "glitch"
            );
        },
        duration
    );

}


/* BLACKOUT */

function blackout(
    duration=600
){

    const screen =
        document.getElementById(
            "screen"
        );

    screen.style.opacity =
        "0";

    setTimeout(
        ()=>{
            screen.style.opacity="1";
        },
        duration
    );

}


/* =========================================================
   CAT
========================================================= */

function showCat(
    scale,
    duration
){

    const cat =
        document.getElementById(
            "cat"
        );

    cat.style.opacity =
        "1";

    cat.style.transform =

        `translate(-50%,-50%)
         scale(${scale})`;

    setTimeout(
        ()=>{

            cat.style.opacity =
                "0";

        },
        duration
    );

}


/* CAT GETS CLOSER */

function moveCatCloser(){

    const cat =
        document.getElementById(
            "cat"
        );

    catDistance += .13;

    if(
        catDistance>.95
    ){

        catDistance=.95;

    }

    cat.style.opacity =
        "1";

    cat.style.transform =

        `translate(-50%,-50%)
         scale(${catDistance})`;

}


/* =========================================================
   BLOOD
========================================================= */

function blood(){

    const container =
        document.getElementById(
            "blood"
        );

    for(
        let i=0;
        i<35;
        i++
    ){

        const drop =
            document.createElement(
                "div"
            );

        drop.className =
            "bloodDrop";

        const size =
            2+
            Math.random()*30;

        drop.style.width =
            size+"px";

        drop.style.height =
            size+"px";

        drop.style.left =
            Math.random()*100+
            "%";

        drop.style.top =
            Math.random()*100+
            "%";

        container.appendChild(
            drop
        );

        setTimeout(
            ()=>{
                drop.remove();
            },
            7000
        );

    }

}


/* =========================================================
   SYMBOL
========================================================= */

function symbol(){

    const el =
        document.getElementById(
            "symbol"
        );

    const symbols = [

        "⛧",
        "†",
        "666",
        "◉",
        "☠"

    ];

    el.textContent =
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];

    el.classList.remove(
        "symbolShow"
    );

    void el.offsetWidth;

    el.classList.add(
        "symbolShow"
    );

}


/* =========================================================
   MINIMAL MESSAGES
========================================================= */

const messages = [

    "DON'T LOOK",

    "HE MOVED",

    "BEHIND YOU",

    "STAY STILL",

    "LOOK AWAY",

    "TOO LATE",

    "HE KNOWS",

    "DON'T BLINK",

    "RUN",

    "HE'S HERE",

    "WRONG CAMERA",

    "WHO ARE YOU",

    "LOOK UP",

    "LOOK DOWN",

    "STOP",

    "LISTEN",

    "HE SAW YOU",

    "TURN AROUND",

    "DON'T",

    "13"

];


function showMessage(){

    const msg =
        document.getElementById(
            "message"
        );

    msg.textContent =
        messages[
            Math.floor(
                Math.random()*
                messages.length
            )
        ];

    msg.classList.remove(
        "messageShow"
    );

    void msg.offsetWidth;

    msg.classList.add(
        "messageShow"
    );

}


/* =========================================================
   CAMERA WARNING
========================================================= */

function cameraAccess(){

    const warning =
        document.getElementById(
            "cameraWarning"
        );

    warning.style.display =
        "flex";

    staticNoise();

    setTimeout(
        ()=>{

            warning.style.display =
                "none";

        },
        1100
    );

}


/* =========================================================
   STAGE 1
========================================================= */

function stageOne(){

    showMessage();

    whisper();

}


/* =========================================================
   STAGE 2
========================================================= */

function stageTwo(){

    glitch();

    showMessage();

    moveCatCloser();

    drone();

}


/* =========================================================
   STAGE 3
========================================================= */

function stageThree(){

    blackout(400);

    setTimeout(
        ()=>{
            showCat(.48,500);
        },
        400
    );

    setTimeout(
        ()=>{
            flash();
        },
        850
    );

    symbol();

    showMessage();

}


/* =========================================================
   STAGE 4
========================================================= */

function stageFour(){

    cameraAccess();

    setTimeout(
        ()=>{
            blood();
        },
        900
    );

    setTimeout(
        ()=>{
            moveCatCloser();
        },
        1200
    );

    glitch(1200);

    scream();

}


/* =========================================================
   STAGE 5
========================================================= */

function stageFive(){

    flash(130);

    setTimeout(
        ()=>{
            showCat(
                1.2,
                2000
            );
        },
        150
    );

    blood();

    symbol();

    scream();

    setTimeout(
        ()=>{
            document
                .getElementById(
                    "final"
                )
                .style.display="flex";
        },
        3000
    );

}


/* =========================================================
   PROGRESSION
========================================================= */

function progress(){

    if(
        idle===12 &&
        stage<2
    ){

        stage=2;

        stageTwo();

    }


    if(
        idle===25 &&
        stage<3
    ){

        stage=3;

        stageThree();

    }


    if(
        idle===40 &&
        stage<4
    ){

        stage=4;

        stageFour();

    }


    if(
        idle===58 &&
        stage<5
    ){

        stage=5;

        stageFive();

    }

}


/* =========================================================
   IDLE TIMER
========================================================= */

setInterval(
    ()=>{

        if(!started){

            return;

        }

        idle++;

        progress();

    },
    1000
);


/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

    if(!started){

        return;

    }

    const random =
        Math.random();


    if(
        random<.18
    ){

        flash();

    }

    else if(
        random<.35
    ){

        glitch();

    }

    else if(
        random<.5
    ){

        showMessage();

    }

    else if(
        random<.62
    ){

        staticNoise();

    }

    else if(
        random<.73 &&
        stage>=2
    ){

        showCat(
            catDistance,
            120
        );

    }

    else if(
        random<.82 &&
        stage>=3
    ){

        symbol();

    }

    else if(
        random<.9 &&
        stage>=4
    ){

        blood();

    }

}


/* =========================================================
   HORROR LOOP
========================================================= */

function horrorLoop(){

    if(!started){

        setTimeout(
            horrorLoop,
            3000
        );

        return;

    }

    const delay =
        3500+
        Math.random()*7000;

    setTimeout(
        ()=>{

            randomEvent();

            horrorLoop();

        },
        delay
    );

}

horrorLoop();


/* =========================================================
   INTRO CLICK
========================================================= */

document
.getElementById("intro")
.addEventListener(
    "click",
    ()=>{

        document
        .getElementById("intro")
        .style.display =
            "none";

        started =
            true;

        initAudio();

        drone();

        setTimeout(
            ()=>{
                showMessage();
            },
            2500
        );

    }
);


/* =========================================================
   CLOCK
========================================================= */

setInterval(
    ()=>{

        const now =
            new Date();

        document
        .getElementById(
            "timestamp"
        )
        .textContent =
            now.toLocaleTimeString();

        const signal =
            Math.max(
                1,
                100 -
                stage*17 -
                Math.floor(
                    Math.random()*8
                )
            );

        document
        .getElementById(
            "status"
        )
        .textContent =
            "SIGNAL: "+
            signal+
            "%";

    },
    1000
);


/* =========================================================
   RANDOM INITIAL ANOMALIES
========================================================= */

setTimeout(
    ()=>{
        showMessage();
    },
    6500
);

setTimeout(
    ()=>{
        glitch(300);
    },
    9000
);

setTimeout(
    ()=>{
        showCat(.2,100);
    },
    14000
);

</script>
