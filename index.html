<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAM_01 // SIGNAL LOST</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: #ddd;
}

#camera {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center,
        rgba(70,70,70,.16),
        rgba(0,0,0,.95) 75%),
        #050505;
    overflow: hidden;
}

/* CRT scanlines */

#camera::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* Static */

#static {
    position: absolute;
    inset: 0;
    opacity: .08;
    pointer-events: none;
    z-index: 18;

    background-image:
        repeating-radial-gradient(
            circle at 20% 30%,
            #fff 0,
            #fff 1px,
            transparent 2px,
            transparent 4px
        );

    animation: staticMove .12s infinite;
}

@keyframes staticMove {
    0% { transform: translate(0,0); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(2px,-2px); }
    75% { transform: translate(-2px,-3px); }
    100% { transform: translate(0,0); }
}

/* Camera HUD */

#hud {
    position: absolute;
    inset: 0;
    z-index: 25;
    pointer-events: none;
}

#rec {
    position: absolute;
    top: 25px;
    left: 30px;
    font-size: 18px;
    color: #ff3333;
    text-shadow: 0 0 10px red;
}

#rec::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink .8s infinite;
}

@keyframes blink {
    50% { opacity: .1; }
}

#cameraName {
    position: absolute;
    top: 25px;
    right: 30px;
    font-size: 15px;
}

#timestamp {
    position: absolute;
    bottom: 25px;
    left: 30px;
}

#warning {
    position: absolute;
    bottom: 25px;
    right: 30px;
    color: #888;
}

/* Vignette */

#vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 19;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.55) 80%,
            rgba(0,0,0,.95)
        );
}

/* Cat */

#cat {
    position: absolute;
    width: 230px;
    height: 330px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.85);

    opacity: 0;

    transition:
        opacity .08s,
        transform .08s;

    z-index: 10;

    filter:
        drop-shadow(0 0 15px rgba(255,0,0,.3));
}

.cat-head {
    position: absolute;
    width: 170px;
    height: 145px;

    left: 30px;
    top: 45px;

    background: #020202;

    border-radius:
        48% 48% 45% 45%;
}

.ear {
    position: absolute;
    width: 70px;
    height: 100px;

    background: #020202;
    top: -55px;
}

.ear.left {
    left: 3px;
    transform: rotate(-25deg);
    clip-path: polygon(0 100%, 40% 0, 100% 100%);
}

.ear.right {
    right: 3px;
    transform: rotate(25deg);
    clip-path: polygon(0 100%, 60% 0, 100% 100%);
}

.eye {
    position: absolute;

    width: 17px;
    height: 32px;

    background: #d90000;
    border-radius: 50%;

    top: 65px;

    box-shadow:
        0 0 12px red,
        0 0 25px rgba(255,0,0,.7);
}

.eye.left {
    left: 42px;
}

.eye.right {
    right: 42px;
}

.mouth {
    position: absolute;

    left: 52px;
    top: 103px;

    width: 66px;
    height: 28px;

    border-bottom:
        5px solid #b00000;

    border-radius: 0 0 50% 50%;
}

.body {
    position: absolute;

    width: 135px;
    height: 180px;

    left: 47px;
    top: 170px;

    background: #020202;

    border-radius:
        50% 50% 15% 15%;
}

/* Hat */

.hat {
    position: absolute;

    width: 120px;
    height: 210px;

    left: 55px;
    top: -100px;

    background:
        repeating-linear-gradient(
            to bottom,
            #850000 0px,
            #850000 35px,
            #050505 35px,
            #050505 65px
        );

    clip-path:
        polygon(
            35% 100%,
            50% 0,
            65% 100%
        );

    transform: rotate(-5deg);
}

/* Blood */

.blood {
    position: absolute;
    width: 20px;
    height: 20px;

    background: #750000;

    border-radius: 50%;

    opacity: 0;

    z-index: 17;

    box-shadow:
        0 0 8px rgba(150,0,0,.6);
}

.blood.big {
    width: 80px;
    height: 80px;
}

@keyframes bloodFlash {
    0% {
        opacity: 0;
        transform: scale(.2);
    }

    15% {
        opacity: .95;
    }

    100% {
        opacity: .65;
        transform: scale(1.2);
    }
}

/* Demonic symbols */

#symbol {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    font-size: 180px;

    color: #8b0000;

    text-shadow:
        0 0 10px red,
        0 0 40px red;

    opacity: 0;

    z-index: 16;

    pointer-events: none;
}

@keyframes symbolFlash {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.3) rotate(-20deg); }
    30% { opacity: .9; }
    60% { opacity: .5; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3) rotate(20deg); }
}

/* Glitch */

.glitch {
    animation: glitch .12s infinite;
}

@keyframes glitch {
    0% {
        transform: translate(0);
        filter: none;
    }

    20% {
        transform: translate(-8px, 3px);
        filter: hue-rotate(90deg);
    }

    40% {
        transform: translate(7px,-4px);
    }

    60% {
        transform: translate(-4px,5px);
        filter: contrast(2);
    }

    80% {
        transform: translate(5px,-2px);
    }

    100% {
        transform: translate(0);
    }
}

/* Flash */

#flash {
    position: fixed;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

/* Blackout */

#blackout {
    position: fixed;
    inset: 0;

    background: #000;

    opacity: 0;

    pointer-events: none;

    z-index: 99;
}

/* Messages */

#message {
    position: absolute;

    left: 50%;
    top: 70%;

    transform: translate(-50%,-50%);

    width: 90%;

    text-align: center;

    font-size: 20px;

    color: #777;

    opacity: 0;

    z-index: 40;

    text-shadow:
        0 0 5px #000;
}

@keyframes messageAppear {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
}

/* Camera error */

#error {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    color: #aaa;

    font-size: 24px;

    opacity: 0;

    z-index: 50;

    text-align: center;
}

/* Mouse presence */

#presence {
    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: rgba(255,0,0,.7);

    box-shadow: 0 0 15px red;

    pointer-events: none;

    z-index: 35;

    opacity: .15;
}

</style>
</head>

<body>

<div id="camera">

    <div id="static"></div>

    <div id="hud">
        <div id="rec">REC</div>
        <div id="cameraName">CAM_01 // HALLWAY</div>

        <div id="timestamp">
            03:17:██:██
        </div>

        <div id="warning">
            SIGNAL: UNSTABLE
        </div>
    </div>

    <div id="cat">

        <div class="hat"></div>

        <div class="cat-head">

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

        </div>

        <div class="body"></div>

    </div>

    <div id="symbol">⛧</div>

    <div id="message"></div>

    <div id="error">
        <div>CAMERA ERROR</div>
        <br>
        <small>UNAUTHORIZED MOVEMENT DETECTED</small>
    </div>

    <div id="flash"></div>
    <div id="blackout"></div>

    <div id="vignette"></div>

    <div id="presence"></div>

</div>

<script>

/* =========================================================
   HORROR CAMERA ENGINE
========================================================= */

let inactivity = 0;
let intensity = 1;
let lastMouse = Date.now();

const camera = document.getElementById("camera");
const cat = document.getElementById("cat");
const flash = document.getElementById("flash");
const blackout = document.getElementById("blackout");
const symbol = document.getElementById("symbol");
const message = document.getElementById("message");
const errorBox = document.getElementById("error");
const presence = document.getElementById("presence");

/* =========================================================
   AUDIO ENGINE
   Generates creepy sounds without external files.
========================================================= */

let audioContext;

function audioInit() {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }
}

/* Low distorted drone */

function drone(duration = 2) {

    audioInit();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const distortion =
        audioContext.createWaveShaper();

    osc.type = "sawtooth";

    osc.frequency.value =
        55 + Math.random() * 35;

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .12,
        audioContext.currentTime + .15
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime + duration
    );

    osc.connect(distortion);
    distortion.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime + duration);
}

/* High-pitched digital scream */

function scream() {

    audioInit();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1600,
        audioContext.currentTime + .45
    );

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .15,
        audioContext.currentTime + .05
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime + .7
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime + .75);
}

/* Whisper-like noise */

function whisper() {

    audioInit();

    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate * .8,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {

        data[i] =
            (Math.random() * 2 - 1)
            *
            Math.sin(i / 30)
            *
            .3;
    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    source.buffer = buffer;

    gain.gain.value = .08;

    source.connect(gain);
    gain.connect(audioContext.destination);

    source.start();
}

/* =========================================================
   FLASH
========================================================= */

function flashScreen(strength = 1) {

    flash.style.background =
        Math.random() > .7
        ? "#ff0000"
        : "#ffffff";

    flash.style.opacity = strength;

    setTimeout(() => {

        flash.style.opacity = 0;

    }, 40 + Math.random() * 100);
}

/* =========================================================
   BLACKOUT
========================================================= */

function blackoutScreen() {

    blackout.style.opacity = 1;

    setTimeout(() => {

        blackout.style.opacity = 0;

    }, 500 + Math.random() * 1800);
}

/* =========================================================
   CAT APPEARANCE
========================================================= */

function revealCat(duration = 600) {

    cat.style.opacity = 1;

    cat.style.transform =
        `
        translate(-50%, -50%)
        scale(${.7 + Math.random() * .7})
        rotate(${Math.random() * 8 - 4}deg)
        `;

    setTimeout(() => {

        cat.style.opacity = 0;

    }, duration);
}

/* =========================================================
   BLOOD SPLATTER
========================================================= */

function bloodSplatter() {

    for (let i = 0; i < 35; i++) {

        const drop =
            document.createElement("div");

        drop.className = "blood";

        if (Math.random() > .92) {
            drop.classList.add("big");
        }

        drop.style.left =
            Math.random() * 100 + "%";

        drop.style.top =
            Math.random() * 100 + "%";

        drop.style.animation =
            `
            bloodFlash
            ${.15 + Math.random() * .4}s
            forwards
            `;

        camera.appendChild(drop);

        setTimeout(() => {
            drop.remove();
        }, 4000);
    }
}

/* =========================================================
   DEMON SYMBOL
========================================================= */

function demonSymbol() {

    const symbols = [
        "⛧",
        "☠",
        "666",
        "†",
        "☽",
        "⸸",
        "👁"
    ];

    symbol.innerText =
        symbols[
            Math.floor(
                Math.random() * symbols.length
            )
        ];

    symbol.style.animation =
        "none";

    void symbol.offsetWidth;

    symbol.style.animation =
        "symbolFlash .8s forwards";
}

/* =========================================================
   GLITCH EVENT
========================================================= */

function glitch() {

    camera.classList.add("glitch");

    setTimeout(() => {

        camera.classList.remove("glitch");

    }, 150 + Math.random() * 500);
}

/* =========================================================
   FAKE CAMERA ERROR
========================================================= */

function cameraError() {

    errorBox.style.opacity = 1;

    setTimeout(() => {

        errorBox.style.opacity = 0;

    }, 700 + Math.random() * 1500);
}

/* =========================================================
   DISTURBING MESSAGES
========================================================= */

const messages = [

    "WHY DID YOU STOP MOVING?",

    "I CAN SEE YOU.",

    "THE CAMERA IS NOT RECORDING THE ROOM.",

    "DON'T LOOK BEHIND YOU.",

    "HE KNOWS YOU ARE STILL THERE.",

    "YOU'VE BEEN HERE FOR TOO LONG.",

    "CAM_01 HAS A SECOND VIEW.",

    "THAT WASN'T THERE BEFORE.",

    "PLEASE KEEP YOUR EYES OPEN.",

    "MOVEMENT DETECTED BEHIND CAMERA.",

    "DO NOT TURN AROUND.",

    "SIGNAL SOURCE: UNKNOWN",

    "HE IS CLOSER NOW.",

    "WHY ARE YOU STILL WATCHING?",

    "I SAW YOU BLINK.",

    "CAMERA 02 IS WATCHING YOU.",

    "THERE IS SOMETHING IN THE HALLWAY.",

    "IT DOESN'T LIKE BEING IGNORED.",

    "DON'T LET HIM SEE YOU.",

    "███ YOU SHOULD LEAVE ███"

];

function creepyMessage() {

    const text =
        messages[
            Math.floor(
                Math.random() * messages.length
            )
        ];

    message.innerText = text;

    message.style.animation =
        "none";

    void message.offsetWidth;

    message.style.animation =
        "messageAppear 4s forwards";

    whisper();
}

/* =========================================================
   RANDOM HORROR EVENT
========================================================= */

function horrorEvent() {

    const events = [

        () => revealCat(300 + intensity * 150),

        () => flashScreen(1),

        () => glitch(),

        () => bloodSplatter(),

        () => demonSymbol(),

        () => cameraError(),

        () => blackoutScreen(),

        () => {

            revealCat(900);

            flashScreen(.7);

            scream();

        },

        () => {

            demonSymbol();

            bloodSplatter();

            glitch();

        },

        () => {

            blackoutScreen();

            setTimeout(() => {

                revealCat(700);

                scream();

            }, 600);

        }

    ];

    const event =
        events[
            Math.floor(
                Math.random() * events.length
            )
        ];

    event();
}

/* =========================================================
   INACTIVITY SYSTEM
========================================================= */

setInterval(() => {

    inactivity++;

    /*
       Every 10 seconds the page becomes
       increasingly unpredictable.
    */

    if (inactivity > 10) {

        intensity =
            Math.min(
                10,
                1 + Math.floor(inactivity / 10)
            );

    }

    /*
       First stage
    */

    if (inactivity === 😎 {

        creepyMessage();

    }

    /*
       Second stage
    */

    if (inactivity === 15) {

        revealCat(800);

        drone();

    }

    /*
       Third stage
    */

    if (inactivity === 22) {

        glitch();

        creepyMessage();

    }

    /*
       Fourth stage
    */

    if (inactivity > 25) {

        const chance =
            Math.min(
                .75,
                .15 + intensity * .06
            );

        if (Math.random() < chance) {

            horrorEvent();

        }
    }

}, 1000);

/* =========================================================
   RANDOM EVENTS EVEN WHILE ACTIVE
========================================================= */

function scheduleRandomEvent() {

    const delay =
        Math.max(
            1800,
            9000 - intensity * 600
        )
        +
        Math.random() * 7000;

    setTimeout(() => {

        if (Math.random() < .7) {

            horrorEvent();

        }

        scheduleRandomEvent();

    }, delay);
}

scheduleRandomEvent();

/* =========================================================
   MOUSE TRACKING
========================================================= */

document.addEventListener("mousemove", e => {

    inactivity = 0;
    lastMouse = Date.now();

    presence.style.left =
        e.clientX + "px";

    presence.style.top =
        e.clientY + "px";

});

/* =========================================================
   CLICK
========================================================= */

document.addEventListener("click", () => {

    audioInit();

    /*
       First click unlocks browser audio.
    */

    if (Math.random() < .45) {

        drone(.7);

    }

    if (Math.random() < .15) {

        scream();

        revealCat(500);

    }

});

/* =========================================================
   FAKE TIMESTAMP
========================================================= */

setInterval(() => {

    const now = new Date();

    const h =
        String(now.getHours())
        .padStart(2,"0");

    const m =
        String(now.getMinutes())
        .padStart(2,"0");

    const s =
        String(now.getSeconds())
        .padStart(2,"0");

    document.getElementById(
        "timestamp"
    ).innerText =
        ${h}:${m}:${s} // FRAME_${Math.floor(Math.random()*9999)};

}, 1000);

/* =========================================================
   PERIODIC RANDOM SYMBOL GLITCH
========================================================= */

setInterval(() => {

    if (Math.random() < .25) {

        demonSymbol();

    }

}, 12000);

/* =========================================================
   OCCASIONAL EYE MOVEMENT
========================================================= */

setInterval(() => {

    if (cat.style.opacity !== "0") {

        const eyes =
            document.querySelectorAll(".eye");

        eyes.forEach(eye => {

            eye.style.transform =
                `translate(
                    ${(Math.random() * 8 - 4)}px,
                    ${(Math.random() * 5 - 2.5)}px
                )`;

        });

    }

}, 300);

/* =========================================================
   STARTUP
========================================================= */

setTimeout(() => {

    creepyMessage();

}, 3500);

</script>

</body>
</html>
